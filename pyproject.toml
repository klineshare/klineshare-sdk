[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "klineshare"
version = "0.2.7"
description = "Official Python SDK for the KlineShare market data API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "KlineShare" }]
keywords = ["klineshare", "stock", "kline", "market-data", "a-share"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "requests>=2.28.0",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5.0"]
ws = ["websocket-client>=1.6.0"]
dev = ["pytest>=7.0", "pandas>=1.5.0", "websocket-client>=1.6.0"]

[project.urls]
Homepage = "https://klineshare.cn"
Documentation = "https://data.klineshare.cn"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: hits a real API (needs key; set KLINESHARE_RUN_LIVE=1)",
]
